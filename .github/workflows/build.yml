name: Build QingScreen APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate sources (only when project files are missing)
        run: |
          if [ ! -f app/build.gradle ]; then
            mkdir -p app/src/main/java/com/poi/qingscreen app/src/main/res/xml app/src/main/res/values app/src/main/res/drawable
            echo '' | base64 -d > settings.gradle
            echo 'cGx1Z2lucyB7CiAgICBpZCAnY29tLmFuZHJvaWQuYXBwbGljYXRpb24nIHZlcnNpb24gJzguNy4zJyBhcHBseSBmYWxzZQp9Cg==' | base64 -d > build.gradle
            echo 'b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bSAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCmFuZHJvaWQuZW5hYmxlSmV0aWZpZXI9ZmFsc2UK' | base64 -d > gradle.properties
            echo '' | base64 -d > app/build.gradle
            echo '' | base64 -d > app/src/main/AndroidManifest.xml
            echo '' | base64 -d > app/src/main/java/com/poi/qingscreen/Util.java
            echo '' | base64 -d > app/src/main/java/com/poi/qingscreen/StatsStore.java
            echo '' | base64 -d > app/src/main/java/com/poi/qingscreen/ClearAccessibilityService.java
            echo '' | base64 -d > app/src/main/java/com/poi/qingscreen/BootReceiver.java
            echo '' | base64 -d > app/src/main/java/com/poi/qingscreen/KeepAliveService.java
            echo '' | base64 -d > app/src/main/java/com/poi/qingscreen/MainActivity.java
            echo '' | base64 -d > app/src/main/res/xml/accessibility_service_config.xml
            echo '' | base64 -d > app/src/main/res/values/strings.xml
            echo 'PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiPz4KPHJlc291cmNlcz4KICAgIDxzdHlsZSBuYW1lPSJBcHBUaGVtZSIgcGFyZW50PSJhbmRyb2lkOlRoZW1lLk1hdGVyaWFsLkxpZ2h0Lk5vQWN0aW9uQmFyIj4KICAgICAgICA8aXRlbSBuYW1lPSJhbmRyb2lkOmZvbnRGYW1pbHkiPnNhbnM8L2l0ZW0+CiAgICA8L3N0eWxlPgo8L3Jlc291cmNlcz4K' | base64 -d > app/src/main/res/values/styles.xml
            echo '' | base64 -d > app/src/main/res/drawable/ic_launcher.xml
            echo '' | base64 -d > app/src/main/res/drawable/ic_notification.xml
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ensure Android SDK parts
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: Build debug APK (self-signed, installable)
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qingscreen-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
